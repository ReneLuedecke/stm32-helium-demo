# Native POSIX/Linux simulation configuration
# Build with: west build -b native_sim

# Inherit base configuration
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=65536

# Logging
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y

# Timer
CONFIG_TIMER=y

# Thermal camera config
CONFIG_THERMAL_HPIX=640
CONFIG_THERMAL_VPIX=480
CONFIG_THERMAL_BIT_DEPTH=14
CONFIG_THERMAL_FRAME_RATE=50
CONFIG_THERMAL_FRAME_POOL_COUNT=3
CONFIG_THERMAL_SYNTHETIC_MODE=y
CONFIG_THERMAL_PATTERN_GRADIENT=y

# Performance
CONFIG_SPEED_OPTIMIZATIONS=y
CONFIG_FPU=y

# Thread monitoring
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y
CONFIG_STATS=y

# Native sim specific
CONFIG_NATIVE_APPLICATION=y
