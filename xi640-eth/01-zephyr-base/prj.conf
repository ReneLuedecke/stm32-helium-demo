# Xi 640 ETH - Zephyr Base Configuration
# STM32N6570-DK @ 150 MHz | 640×480 Thermal @ 14-bit

# ========================================
# SYSTEM CONFIGURATION
# ========================================
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# CPU & Clock
CONFIG_CPU_CORTEX_M55=y
CONFIG_ARM_MPU=y
CONFIG_SYS_CLOCK_HW_CYCLES_PER_SEC=150000000

# ========================================
# MEMORY MANAGEMENT
# ========================================
CONFIG_SRAM_BASE_ADDRESS=0x24000000
CONFIG_SRAM_SIZE=1024

# AXISRAM regions for DMA
CONFIG_NOCACHE_MEMORY=y
CONFIG_DCACHE=y
CONFIG_ICACHE=y

# ========================================
# STM32 HAL & DRIVERS
# ========================================
CONFIG_SOC_SERIES_STM32N6X=y
CONFIG_SOC_STM32N657XX=y
CONFIG_BOARD_STM32N6570_DK=y

# GPIO for status LEDs
CONFIG_GPIO=y
CONFIG_PINCTRL=y

# ========================================
# DCMIPP (Digital Camera Interface)
# ========================================
CONFIG_VIDEO=y
CONFIG_VIDEO_BUFFER_POOL_SZ_MAX=3

# DMA for DCMIPP data transfer
CONFIG_DMA=y
CONFIG_DMA_STM32_V2=y
CONFIG_DMAMUX_STM32=y

# ========================================
# TIMER & SYNCHRONIZATION
# ========================================
CONFIG_TIMER=y
CONFIG_COUNTER=y

# ========================================
# EXTERNAL MEMORY (HyperRAM + HyperFlash)
# ========================================
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_MEMC=y
CONFIG_MEMC_STM32_XSPI=y

# ========================================
# LOGGING & DEBUGGING
# ========================================
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_PRINTK=y

# Performance monitoring
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y
CONFIG_STATS=y
CONFIG_STATS_SYSTEM=y

# ========================================
# PERFORMANCE OPTIMIZATIONS
# ========================================
CONFIG_SPEED_OPTIMIZATIONS=y
CONFIG_NO_OPTIMIZATIONS=n
CONFIG_COMPILER_OPT="-O3 -ffast-math"

# ARM Helium MVE support
CONFIG_FPU=y
CONFIG_ARM_HELIUM=y
CONFIG_CMSIS_DSP=y

# ========================================
# THERMAL CAMERA SPECIFIC
# ========================================
# Frame dimensions: 640×480 @ 14-bit = 614,400 bytes/frame
# Target: 160 FPS → 98.3 MB/s bandwidth

# Synthetic frame generator settings (custom Kconfig)
CONFIG_THERMAL_HPIX=640
CONFIG_THERMAL_VPIX=480
CONFIG_THERMAL_BIT_DEPTH=14
CONFIG_THERMAL_FRAME_RATE=50

# Memory allocation
CONFIG_THERMAL_FRAME_POOL_COUNT=3
CONFIG_THERMAL_CALIBRATION_ENABLE=y
