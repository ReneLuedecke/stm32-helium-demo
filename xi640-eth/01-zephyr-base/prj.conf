# Xi 640 ETH - Session 1: Minimal Configuration
# STM32N6570-DK | Synthetic Frame Generator Only
# Hardware-specific features disabled for initial testing

# ========================================
# SYSTEM BASICS
# ========================================
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=65536

# ========================================
# HARDWARE BASICS
# ========================================
# GPIO for LED status indication
CONFIG_GPIO=y

# ========================================
# CONSOLE & LOGGING
# ========================================
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_PRINTK=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DEFAULT_LEVEL=3

# ========================================
# PERFORMANCE
# ========================================
CONFIG_SPEED_OPTIMIZATIONS=y

# FPU support
CONFIG_FPU=y

# ========================================
# CUSTOM THERMAL APP CONFIG
# ========================================
# These are defined in our Kconfig
CONFIG_THERMAL_HPIX=640
CONFIG_THERMAL_VPIX=480
CONFIG_THERMAL_BIT_DEPTH=14
CONFIG_THERMAL_FRAME_RATE=50
CONFIG_THERMAL_FRAME_POOL_COUNT=3
CONFIG_THERMAL_SYNTHETIC_MODE=y
CONFIG_THERMAL_PATTERN_GRADIENT=y

# ========================================
# NOTES FOR SESSION 2
# ========================================
# The following will be enabled in Session 2 (Helium MVE):
# - CONFIG_ARM_HELIUM=y (requires proper toolchain setup)
# - CONFIG_CMSIS_DSP=y
# - CONFIG_VIDEO=y (DCMIPP)
# - CONFIG_DMA=y
# - CONFIG_MEMC_STM32_XSPI=y (HyperRAM/Flash)
