# Xi 640 ETH - Session 1: Thermal Frame Generator Configuration
# Minimal settings for thermal processing without custom memory regions

# ========================================
# SYSTEM BASICS
# ========================================
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=1048576

# ========================================
# CONSOLE & LOGGING
# ========================================
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_PRINTK=y

# ========================================
# THREAD SUPPORT
# ========================================
CONFIG_THREAD_NAME=y

# ========================================
# FPU SUPPORT (for thermal calculations)
# ========================================
CONFIG_FPU=y
CONFIG_ARM_MVE_FP=y

# ========================================
# PERFORMANCE
# ========================================
CONFIG_SPEED_OPTIMIZATIONS=y
