# Xi 640 ETH - Session 1: Thermal Frame Generator Configuration
# Minimal working configuration - auto-configured options removed

# ========================================
# SYSTEM BASICS
# ========================================
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=131072

# ========================================
# CONSOLE & LOGGING
# ========================================
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_PRINTK=y
CONFIG_LOG=y

# ========================================
# TIMING & PERFORMANCE
# ========================================
# Note: CONFIG_CPU_CORTEX_M_HAS_DWT auto-enabled for Cortex-M55
CONFIG_TIMING_FUNCTIONS=y
CONFIG_SPEED_OPTIMIZATIONS=y

# ========================================
# FPU SUPPORT (for thermal calculations)
# ========================================
# Note: ARM Helium MVE is enabled via compiler flags in CMakeLists.txt
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# ========================================
# EXTERNAL MEMORY (HyperRAM for frame buffers)
# ========================================
CONFIG_STM32_MEMMAP=y
CONFIG_MULTI_HEAP=y
CONFIG_MEM_ATTR=y
CONFIG_MEM_ATTR_HEAP=y

# ========================================
# HARDWARE
# ========================================
CONFIG_GPIO=y
CONFIG_FLASH=y
CONFIG_HW_STACK_PROTECTION=y
CONFIG_ARM_MPU=y
CONFIG_DYNAMIC_INTERRUPTS=y
