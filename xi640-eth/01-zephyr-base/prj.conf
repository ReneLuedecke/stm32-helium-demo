# Xi 640 ETH - Minimal Boot Test Configuration
# Based on proven hello_world approach

# ========================================
# CONSOLE & UART (from working hello_world)
# ========================================
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=n
CONFIG_EARLY_CONSOLE=y

# ========================================
# STACK SIZES - INCREASED TO FIX 27 KB OVERFLOW
# ========================================
CONFIG_MAIN_STACK_SIZE=32768
CONFIG_IDLE_STACK_SIZE=4096
CONFIG_ISR_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# ========================================
# HEAP for k_malloc() (reduced for minimal test)
# ========================================
CONFIG_HEAP_MEM_POOL_SIZE=131072

# ========================================
# TIMING
# ========================================
CONFIG_TIMING_FUNCTIONS=y

# ========================================
# FPU SUPPORT
# ========================================
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# ========================================
# EXTERNAL MEMORY (PSRAM)
# ========================================
CONFIG_STM32_MEMMAP=y
CONFIG_MULTI_HEAP=y
CONFIG_MEM_ATTR=y
CONFIG_MEM_ATTR_HEAP=y

# ========================================
# HARDWARE
# ========================================
CONFIG_GPIO=y
CONFIG_FLASH=y
CONFIG_HW_STACK_PROTECTION=y
CONFIG_ARM_MPU=y
CONFIG_DYNAMIC_INTERRUPTS=y

# ========================================
# OPTIMIZATION
# ========================================
CONFIG_SPEED_OPTIMIZATIONS=y

# ========================================
# DEBUG
# ========================================
CONFIG_STACK_SENTINEL=y
CONFIG_THREAD_STACK_INFO=y

# Disable features to reduce RAM usage
CONFIG_THREAD_MONITOR=n
CONFIG_THREAD_NAME=n
