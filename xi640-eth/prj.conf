# Xi 640 ETH Thermal Processing Configuration
# Session 1 + Session 2 Integration

# ============================================
# ARM Helium MVE Configuration (Session 2)
# ============================================
CONFIG_ARM_MVE_FP=y
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# ============================================
# Timing and Performance Measurement
# ============================================
CONFIG_TIMING_FUNCTIONS=y
CONFIG_CPU_CORTEX_M_HAS_DWT=y

# ============================================
# Memory Configuration
# ============================================
CONFIG_HEAP_MEM_POOL_SIZE=131072
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_IDLE_STACK_SIZE=2048

# ============================================
# Console and Logging
# ============================================
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# ============================================
# Math Library Support
# ============================================
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y

# ============================================
# Performance Optimizations
# ============================================
CONFIG_SPEED_OPTIMIZATIONS=y
CONFIG_NO_OPTIMIZATIONS=n
CONFIG_SIZE_OPTIMIZATIONS=n

# ============================================
# System Configuration
# ============================================
CONFIG_SYS_CLOCK_HW_CYCLES_PER_SEC=600000000
